services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uptime_control
      POSTGRES_USER: uptime_control
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - uptime_control_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uptime_control -d uptime_control"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgresql://uptime_control:${POSTGRES_PASSWORD}@postgres:5432/uptime_control
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?PUBLIC_ORIGIN is required}
      BASE_PATH: ${BASE_PATH:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    ports:
      - 127.0.0.1:${UPTIME_HTTP_PORT:-8080}:8080
    networks:
      - internal

volumes:
  uptime_control_postgres:

networks:
  internal:
